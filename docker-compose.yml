services:
  postgres:
    image: postgres:16-alpine
    container_name: batomon-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-batomon}
      POSTGRES_USER: ${POSTGRES_USER:-batomon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local}
    ports:
      - "5432:5432"
    volumes:
      - batomon_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: batomon-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB:-batomon};Username=${POSTGRES_USER:-batomon};Password=${POSTGRES_PASSWORD:-change-me-local}
      Jwt__Secret: ${JWT_SECRET:-change-this-development-secret-at-least-32-chars}
      Jwt__Issuer: ${JWT_ISSUER:-batomon-tracker}
    ports:
      - "5000:8080"

volumes:
  batomon_postgres_data:
